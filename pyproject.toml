[project]
name = "car-rag"
version = "0.1.0"
description = "RAG chatbot over MG ZS car-manual warning messages (OpenRouter), with RAGAS evaluation."
authors = [{ name = "Ziad Elkafoury" }]
requires-python = ">=3.10"
dependencies = [
    # Pinned to the langchain 0.3 generation: ragas 0.3.x is incompatible
    # with langchain 1.x / langchain-community 0.4 (removed modules).
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langchain-community>=0.3.27,<0.4",
    "langchain-chroma>=0.2,<0.4",
    "langchain-text-splitters>=0.3,<1",
    "unstructured>=0.18",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "typer>=0.12",
    "requests>=2",
    "rank-bm25>=0.2",
    "ragas>=0.3.6,<0.4",
]

[project.scripts]
car-rag = "car_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
